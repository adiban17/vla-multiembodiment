# Shared defaults for every run (docs/spec.md "Training recipe"). Values are the spec's.
# Pick a variant with group overrides, change any value with a dotted override, e.g.
#   python -m vla.train cond=token seed=1 train.steps=5000
# Groups: cond (configs/cond/), adapt (configs/adapt/), baseline (configs/baseline/), size (configs/size/).
# A baseline is a per-robot specialist instead of the VLA, e.g.
#   python -m vla.train baseline=resnet18 robot=fetch seed=1

cond: film        # none | token | film | sep_heads
adapt: frozen     # frozen | frozen_matched | full_ft | lora16 (configs/adapt/)
baseline: none    # none (the VLA) | bc_mlp | resnet18
size: full        # full | tiny (Mac CPU tests)
robot: both       # both (the VLA) | pusht | fetch (a baseline trains on one robot)
seed: 0

model:
  width: 384
  depth: 8
  heads: 6
  ffn: 1536
  dropout: 0.1
  n_queries: 16     # 16-step action chunks
  film_dim: 64      # robot embedding size for FiLM

encoder:            # DINOv2 adaptation (Phase 6); configs/adapt/ sets these. MiniLM is always frozen.
  mode: frozen      # frozen (cached features) | full (all DINOv2 weights train) | lora (LoRA adapters train)
  lr: null          # DINOv2 learning rate (full 1e-5, LoRA 1e-4); the head keeps optim.lr
  lora_r: 16        # LoRA rank: each adapted layer learns B (384x16) times A (16x384)
  lora_alpha: 32    # LoRA scale: the update is multiplied by alpha / r = 2
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj]   # query, key, value of all 12 blocks (transformers 5 names)

bc:                 # baselines only (docs/spec.md "Baselines"); configs/baseline/ sets these
  image_size: 64    # frames are resized to this by preprocess_image() inside the model
  hidden: 512       # MLP head: 3 Linear layers, this wide
  pretrained: true  # ResNet-18: start from the ImageNet weights

data:
  cache_dir: null           # null = search inputs_dir() (/kaggle/input on Kaggle) for the feature cache
  mode: cached              # cached DINOv2 features (frozen encoders); baselines: pixels (raw uint8 frames)
  batch_size: 256           # half PushT, half FetchPush (baselines: 128, one robot)
  val_batch_size: 512
  num_workers: 4            # Kaggle gives 4 CPU cores
  prefetch_factor: 4
  allow_debug_images: false # true only for Mac tests; always refused on Kaggle

optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 300         # spec: 500; shortened with train.steps (see CLAUDE.md)
  grad_clip: 1.0

train:
  steps: 4000               # spec: 20k; a T4 does 2.0 steps/s at batch 256 (see CLAUDE.md)
  val_every: 1000
  log_every: 50
  amp: true                 # fp16 autocast + GradScaler, CUDA only (T4 has no bf16)
  save_checkpoint: true

eval:                       # closed-loop rollouts of the final model (docs/spec.md "Evaluation protocol")
  enabled: true
  n_episodes: 50            # per robot
  seed_start: 100000        # env seeds 100000..100049, the same for every run
  exec_steps: 8             # execute the first 8 of the 16 predicted actions, then predict again
  n_videos: 3               # per robot: one success, one failure, one random episode
  paraphrase: 0             # instruction: 0-7 = training sentences, 8-9 = held out

wandb:
  project: vla-multiembodiment
